server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Resolve tailnet hostnames dynamically via Tailscale MagicDNS (100.100.100.100)
    resolver 100.100.100.100 valid=5s ipv6=off;

    location / {
        set $pc_upstream http://mypc.tailnet.internal:8080;
        proxy_pass $pc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
    }
}

