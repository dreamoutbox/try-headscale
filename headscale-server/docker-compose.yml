services:
  headscale:
    image: headscale/headscale:latest
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ./config:/etc/headscale
      - ./data:/var/lib/headscale
      - ./scripts:/scripts:ro
    ports:
      - "8080:8080" # direct HTTP access via VPS IP

  relay:
    image: nginx:alpine
    container_name: vps-relay-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/nginx-relay.conf:/etc/nginx/conf.d/default.conf:ro
