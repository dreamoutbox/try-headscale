services:
  website:
    image: nginx:alpine
    container_name: website
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
    networks:
      - meshnet
    # no host port published — only reachable inside the docker network

  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-client
    hostname: ${TS_HOSTNAME:-mypc}
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ts-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./scripts:/scripts:ro
    networks:
      - meshnet
    restart: unless-stopped
    entrypoint: [ "/scripts/entrypoint.sh" ]

  ubuntu:
    image: ubuntu:24.04
    container_name: ubuntu
    hostname: ${UBUNTU_HOSTNAME:-ubuntu}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ubuntu-ts-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./scripts:/scripts:ro
    networks:
      - ubuntunet
    restart: unless-stopped
    entrypoint: [ "/scripts/entrypoint-ubuntu.sh" ]

networks:
  meshnet:
    driver: bridge
  ubuntunet:
    driver: bridge
